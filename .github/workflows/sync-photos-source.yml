name: Sync verified photos source

on:
  push:
    branches:
      - feature/photos-v0.1.0
    paths:
      - '.github/workflows/sync-photos-source.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/photos-v0.1.0
          fetch-depth: 0
      - name: Decode verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/photos-v0.1.0.part-* > /tmp/photos-v0.1.0.b64
          base64 -d /tmp/photos-v0.1.0.b64 > /tmp/photos-v0.1.0.tar.gz
          tar -xzf /tmp/photos-v0.1.0.tar.gz -C .
          rm -rf .sync IMPLEMENTATION_STATUS.md .github/workflows/sync-photos-source.yml
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xdecaro automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement xdecaro Photos v0.1.0' || exit 0
          git push origin HEAD:feature/photos-v0.1.0
